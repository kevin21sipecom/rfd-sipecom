[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generador-rfd-sipecom"
version = "0.2.0"
description = "Generador local de RFD Word con formato SIPECOM"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.2,<2", "lxml>=5,<7", "python-pptx>=1,<2", "pypdf>=4,<7","openpyxl>=3.1,<4","fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
generador-rfd = "generador_rfd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["generador_rfd*"]

[tool.setuptools.package-data]
generador_rfd = ["static/*", "static/assets/*"]


[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Captura de pantallas del proyecto y del prototipo con Chrome o Edge instalados (no descarga navegadores).
prototipo = ["playwright>=1.45"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["claude: llama a Claude Code CLI real (requiere sesión iniciada)", "codex: llama a Codex CLI real (requiere codex login)"]
